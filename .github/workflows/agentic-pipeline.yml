name: Agentic Playwright SDLC Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  agentic-test-suite:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to automatically commit and push self-healing cache updates

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests (API Contract + UI + Self-Healing)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: npx playwright test

      - name: Upload Test Results & HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Commit Back Healed Selectors (Self-Healing Feedback Loop)
        if: always()
        run: |
          git config --global user.name "Agentic AI Bot"
          git config --global user.email "ai-bot@workflow.local"
          
          # Check if healing-cache.json has changed
          if git status --porcelain | grep -q "healing-cache.json"; then
            echo "✨ Drifted selectors detected and healed. Committing updates..."
            git add healing-cache.json
            git commit -m "chore(ai): auto-heal drifted UI selectors via Gemini 3.5 Flash-Lite [skip ci]"
            git push
          else
            echo "🚀 No locator drift detected. Cache is up to date."
          fi